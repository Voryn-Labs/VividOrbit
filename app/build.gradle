apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.vorynlabs.vividorbit'
    compileSdk 34

    defaultConfig {
        applicationId "com.vorynlabs.vividorbit"
        minSdk 28
        targetSdk 34
        versionCode 3
        versionName "2.1.0"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                def storePass = System.getenv("VIVIDORBIT_STORE_PASSWORD")
                def keyPass = System.getenv("VIVIDORBIT_KEY_PASSWORD") ?: storePass
                if (storePass) {
                    storeFile rootProject.file(keystoreProperties['storeFile'])
                    storePassword storePass
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keyPass
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'

    implementation files('libs/mochitif-release.aar')
}
