<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VividOrbit</title>
  <style>
    :root {
      --bg: #0A0C10;
      --surface: #12151C;
      --line: #2B3140;
      --text: #F5F7FA;
      --muted: #8A929E;
      --accent: #2DD4BF;
      --gold: #FBBF24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 28px 20px 48px;
      max-width: 560px;
      margin: 0 auto;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .brand-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .btn-sync {
      background: none;
      border: 0;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 0;
    }
    .panel { margin-bottom: 28px; }
    .label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .setting-label { font-size: 15px; font-weight: 500; }
    .setting-desc { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: var(--line);
      border-radius: 24px;
      transition: .2s;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 18px; width: 18px; left: 3px; bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: .2s;
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider:before { transform: translateX(18px); }
    select, input[type="text"], input[type="number"] {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 0;
      outline: none;
    }
    .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .action-btn {
      flex: 1;
      min-width: 90px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 10px 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .action-btn.primary { border-color: var(--accent); color: var(--accent); }
    .filter-bar { display: flex; gap: 18px; margin-bottom: 14px; }
    .filter-btn {
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      padding: 6px 0;
      border-bottom: 1px solid transparent;
    }
    .filter-btn.active { color: var(--text); border-bottom-color: var(--accent); }
    .search-box {
      width: 100%;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      padding: 10px 0;
      font-size: 15px;
      margin-bottom: 8px;
      outline: none;
      border-radius: 0;
    }
    .channel-list { display: flex; flex-direction: column; }
    .channel-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      background: none;
    }
    .channel-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .channel-num-badge {
      min-width: 36px;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      background: none;
      border: 0;
      padding: 0;
      text-align: left;
    }
    .channel-text { flex: 1; min-width: 0; }
    .channel-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .channel-hidden-badge {
      display: inline-block;
      margin-left: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 1px 5px;
      vertical-align: middle;
    }
    .channel-dth { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .channel-actions { display: flex; gap: 4px; flex-shrink: 0; min-width: 140px; }
    .icon-btn {
      background: none;
      border: 0;
      color: var(--muted);
      width: 32px;
      height: 32px;
      font-size: 13px;
    }
    .icon-btn.fav.active { color: var(--gold); }
    .icon-btn.tune { width: auto; color: var(--accent); font-weight: 600; font-size: 12px; padding: 0 6px; }
    .icon-btn.unhide { width: auto; color: var(--gold); font-weight: 600; font-size: 11px; padding: 0 6px; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 10px 16px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 20;
    }
    .toast.show { opacity: 1; }
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(10,12,16,.86);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; z-index: 30;
    }
    .modal-card {
      background: var(--surface);
      border: 1px solid var(--line);
      width: 100%; max-width: 340px;
      padding: 22px;
    }
    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand-title">VividOrbit</div>
      <div class="brand-sub" id="channel-count-text">Connecting</div>
    </div>
    <button class="btn-sync" onclick="loadState()">Refresh</button>
  </header>

  <section class="panel">
    <div class="label">Lineup</div>
    <div class="row">
      <div>
        <div class="setting-label">Custom numbers</div>
        <div class="setting-desc">Use your own 1…N map</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-custom-numbers" onchange="updateCustomToggle()">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <div>
        <div class="setting-label">Startup</div>
        <div class="setting-desc">What plays when the app opens</div>
      </div>
      <select id="select-startup-mode" onchange="updateStartupMode()">
        <option value="last">Last watched</option>
        <option value="fixed">Fixed default</option>
        <option value="first">First in list</option>
      </select>
    </div>
    <div class="row" id="row-default-channel" style="display:none;">
      <div>
        <div class="setting-label">Default channel</div>
        <div class="setting-desc">Fixed startup</div>
      </div>
      <select id="select-default-channel" onchange="updateDefaultChannel()"></select>
    </div>
    <div class="actions">
      <button class="action-btn" onclick="autoRenumber()">Auto 1–N</button>
      <button class="action-btn" onclick="exportLineup()">Backup</button>
      <button class="action-btn" onclick="triggerImport()">Restore</button>
      <input type="file" id="file-import" style="display:none" accept=".json" onchange="handleFileImport(event)">
    </div>
  </section>

  <section class="panel">
    <div class="filter-bar">
      <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" id="filter-favs" onclick="setFilter('favs')">Favorites</button>
    </div>
    <input type="text" class="search-box" id="search-input" placeholder="Search" oninput="filterChannels()">
    <div class="channel-list" id="channel-container"></div>
  </section>

  <div class="toast" id="toast"></div>
  <div class="modal-overlay" id="edit-modal" style="display:none;">
    <div class="modal-card">
      <div class="modal-title" id="modal-channel-name">Number</div>
      <div style="margin-bottom:12px;font-size:12px;color:var(--muted);" id="modal-dth-info"></div>
      <input type="number" id="modal-input-number" style="width:100%;font-size:22px;text-align:center;font-weight:600;padding:12px;" min="1" max="9999">
      <div id="modal-conflict-warning" style="color:var(--gold);font-size:12px;margin-top:8px;display:none;"></div>
      <div class="modal-actions">
        <button class="action-btn" onclick="closeEditModal()">Cancel</button>
        <button class="action-btn primary" onclick="saveModalNumber()">Save</button>
      </div>
    </div>
  </div>

  <script>
    let sessionToken = "__SESSION_TOKEN__";
    if (sessionToken === "__" + "SESSION_TOKEN__" || !sessionToken) {
      const urlParams = new URLSearchParams(window.location.search);
      sessionToken = urlParams.get('t') || sessionStorage.getItem('vivid_token') || "";
    }
    if (sessionToken) {
      sessionStorage.setItem('vivid_token', sessionToken);
    }

    let state = {
      channels: [],
      favoriteIds: [],
      customNumbersEnabled: false,
      startupMode: "last",
      defaultChannelId: -1
    };

    let activeFilter = 'all';
    let editingChannelId = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    async function apiRequest(endpoint, method = 'GET', data = null) {
      const opts = {
        method,
        headers: {
          'Content-Type': 'application/json',
          'X-Token': sessionToken
        }
      };
      if (data) opts.body = JSON.stringify(data);
      try {
        const res = await fetch(endpoint, opts);
        if (res.status === 401) {
          sessionStorage.removeItem('vivid_token');
          showToast("⚠ Session expired. Please rescan QR.");
          return null;
        }
        return await res.json();
      } catch (e) {
        showToast("⚠ Connection error");
        return null;
      }
    }

    async function loadState() {
      const data = await apiRequest('/api/state');
      if (!data) return;
      state = data;
      state.favoriteIds = state.favoriteIds || [];

      document.getElementById('channel-count-text').textContent = `${state.channels.length} channels (${state.favoriteIds.length} ★)`;
      document.getElementById('toggle-custom-numbers').checked = state.customNumbersEnabled;
      document.getElementById('select-startup-mode').value = state.startupMode;

      const defRow = document.getElementById('row-default-channel');
      const defSelect = document.getElementById('select-default-channel');
      defRow.style.display = state.startupMode === 'fixed' ? 'flex' : 'none';

      defSelect.innerHTML = '';
      state.channels.forEach(ch => {
        const opt = document.createElement('option');
        opt.value = ch.id;
        opt.textContent = `${ch.displayNumber}. ${ch.name}`;
        if (ch.id === state.defaultChannelId) opt.selected = true;
        defSelect.appendChild(opt);
      });

      filterChannels();
      showToast("Lineup synced with TV");
    }

    function setFilter(filter) {
      activeFilter = filter;
      document.getElementById('filter-all').className = filter === 'all' ? 'filter-btn active' : 'filter-btn';
      document.getElementById('filter-favs').className = filter === 'favs' ? 'filter-btn active' : 'filter-btn';
      filterChannels();
    }

    function renderChannels(list) {
      const container = document.getElementById('channel-container');
      container.innerHTML = '';

      if (list.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.style.textAlign = 'center';
        emptyDiv.style.padding = '32px';
        emptyDiv.style.color = 'var(--text-secondary)';
        emptyDiv.style.fontSize = '14px';
        emptyDiv.textContent = 'No channels found.';
        container.appendChild(emptyDiv);
        return;
      }

      list.forEach(ch => {
        const isFav = state.favoriteIds.includes(ch.id);
        const isHidden = !!ch.isHidden;
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.dataset.hidden = isHidden ? 'true' : 'false';

        // Left info container
        const infoDiv = document.createElement('div');
        infoDiv.className = 'channel-info';

        const favBtn = document.createElement('button');
        favBtn.className = `icon-btn fav ${isFav ? 'active' : ''}`;
        favBtn.title = isFav ? 'Unfavorite' : 'Favorite';
        favBtn.textContent = isFav ? '★' : '☆';
        favBtn.onclick = () => toggleFavorite(ch.id);

        const badge = document.createElement('div');
        badge.className = 'channel-num-badge';
        badge.textContent = ch.displayNumber;
        badge.onclick = () => openEditModal(ch.id);

        const textDiv = document.createElement('div');
        textDiv.className = 'channel-text';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'channel-name';
        nameDiv.textContent = ch.name;
        if (isHidden) {
          const hiddenBadge = document.createElement('span');
          hiddenBadge.className = 'channel-hidden-badge';
          hiddenBadge.textContent = 'hidden';
          nameDiv.appendChild(hiddenBadge);
        }

        const dthDiv = document.createElement('div');
        dthDiv.className = 'channel-dth';
        dthDiv.textContent = `DTH: ${ch.originalNumber}`;

        textDiv.appendChild(nameDiv);
        textDiv.appendChild(dthDiv);

        infoDiv.appendChild(favBtn);
        infoDiv.appendChild(badge);
        infoDiv.appendChild(textDiv);

        // Right actions container
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'channel-actions';

        if (isHidden) {
          const unhideBtn = document.createElement('button');
          unhideBtn.className = 'icon-btn unhide';
          unhideBtn.title = 'Unhide';
          unhideBtn.textContent = 'Unhide';
          unhideBtn.onclick = () => unhideChannel(ch.id);
          actionsDiv.appendChild(unhideBtn);
        }

        const tuneBtn = document.createElement('button');
        tuneBtn.className = 'icon-btn tune';
        tuneBtn.textContent = 'Tune';
        tuneBtn.onclick = () => tuneChannel(ch.id);

        const upBtn = document.createElement('button');
        upBtn.className = 'icon-btn';
        upBtn.title = 'Move Up';
        upBtn.textContent = '▲';
        upBtn.onclick = () => moveChannel(ch.id, -1);

        const downBtn = document.createElement('button');
        downBtn.className = 'icon-btn';
        downBtn.title = 'Move Down';
        downBtn.textContent = '▼';
        downBtn.onclick = () => moveChannel(ch.id, 1);

        const topBtn = document.createElement('button');
        topBtn.className = 'icon-btn';
        topBtn.title = 'Move to Top';
        topBtn.textContent = 'Top';
        topBtn.onclick = () => moveToTop(ch.id);

        actionsDiv.appendChild(tuneBtn);
        actionsDiv.appendChild(upBtn);
        actionsDiv.appendChild(downBtn);
        actionsDiv.appendChild(topBtn);

        card.appendChild(infoDiv);
        card.appendChild(actionsDiv);
        container.appendChild(card);
      });
    }

    function filterChannels() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      let list = state.channels;

      if (activeFilter === 'favs') {
        list = list.filter(ch => state.favoriteIds.includes(ch.id));
      }

      if (q) {
        list = list.filter(ch => 
          ch.name.toLowerCase().includes(q) || 
          String(ch.displayNumber).includes(q) || 
          String(ch.originalNumber).includes(q)
        );
      }
      renderChannels(list);
    }

    async function toggleFavorite(channelId) {
      const res = await apiRequest('/api/favorite', 'POST', { channelId });
      if (res && res.success) {
        if (res.isFavorite) {
          if (!state.favoriteIds.includes(channelId)) state.favoriteIds.push(channelId);
          showToast("Added to Favorites ★");
        } else {
          state.favoriteIds = state.favoriteIds.filter(id => id !== channelId);
          showToast("Removed from Favorites");
        }
        document.getElementById('channel-count-text').textContent = `${state.channels.length} channels (${state.favoriteIds.length} ★)`;
        filterChannels();
      }
    }

    async function moveChannel(channelId, delta) {
      const index = state.channels.findIndex(c => c.id === channelId);
      if (index === -1) return;

      const targetIndex = index + delta;
      if (targetIndex < 0 || targetIndex >= state.channels.length) return;

      const item = state.channels.splice(index, 1)[0];
      state.channels.splice(targetIndex, 0, item);

      const orderedIds = state.channels.map(c => c.id);
      filterChannels();

      const res = await apiRequest('/api/reorder', 'POST', { orderedChannelIds: orderedIds });
      if (res && res.success) {
        showToast("Reordered channel");
        loadState();
      }
    }

    async function moveToTop(channelId) {
      const index = state.channels.findIndex(c => c.id === channelId);
      if (index <= 0) return;

      const item = state.channels.splice(index, 1)[0];
      state.channels.unshift(item);

      const orderedIds = state.channels.map(c => c.id);
      filterChannels();

      const res = await apiRequest('/api/reorder', 'POST', { orderedChannelIds: orderedIds });
      if (res && res.success) {
        showToast(`Moved ${item.name} to Top`);
        loadState();
      }
    }

    async function tuneChannel(id) {
      const res = await apiRequest('/api/tune', 'POST', { channelId: id });
      if (res && res.success) showToast("Tuned channel on TV");
    }

    async function unhideChannel(channelId) {
      const res = await apiRequest('/api/hidden', 'POST', { channelId, hidden: false });
      if (res && res.success) {
        showToast("Channel restored");
        loadState();
      }
    }

    async function updateCustomToggle() {
      const val = document.getElementById('toggle-custom-numbers').checked;
      await apiRequest('/api/config', 'POST', { customNumbersEnabled: val });
      loadState();
    }

    async function updateStartupMode() {
      const mode = document.getElementById('select-startup-mode').value;
      await apiRequest('/api/config', 'POST', { startupMode: mode });
      loadState();
    }

    async function updateDefaultChannel() {
      const id = parseInt(document.getElementById('select-default-channel').value);
      await apiRequest('/api/config', 'POST', { defaultChannelId: id });
      showToast("Default channel saved");
    }

    async function autoRenumber() {
      if (!confirm("Auto-renumber all channels linearly from 1 to N?")) return;
      const orderedIds = state.channels.map(c => c.id);
      const res = await apiRequest('/api/reorder', 'POST', { orderedChannelIds: orderedIds });
      if (res && res.success) {
        showToast("Renumbered 1..N");
        loadState();
      }
    }

    function openEditModal(channelId) {
      editingChannelId = channelId;
      const ch = state.channels.find(c => c.id === channelId);
      if (!ch) return;

      document.getElementById('modal-channel-name').textContent = ch.name;
      document.getElementById('modal-dth-info').textContent = `Current Number: ${ch.displayNumber} (DTH: ${ch.originalNumber})`;
      const numInput = document.getElementById('modal-input-number');
      numInput.value = ch.displayNumber;
      
      const conflictDiv = document.getElementById('modal-conflict-warning');
      conflictDiv.style.display = 'none';

      numInput.oninput = () => {
        const val = numInput.value.trim();
        const conf = state.channels.find(c => String(c.displayNumber) === val && c.id !== channelId);
        if (conf) {
          conflictDiv.textContent = `⚠ Used by ${conf.name}. Saving will swap numbers.`;
          conflictDiv.style.display = 'block';
        } else {
          conflictDiv.style.display = 'none';
        }
      };

      document.getElementById('edit-modal').style.display = 'flex';
      setTimeout(() => numInput.focus(), 100);
    }

    function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
      editingChannelId = null;
    }

    async function saveModalNumber() {
      const val = document.getElementById('modal-input-number').value.trim();
      if (!val) return;
      const res = await apiRequest('/api/number', 'POST', { channelId: editingChannelId, number: val });
      if (res && res.success) {
        showToast("Channel number updated");
        closeEditModal();
        loadState();
      }
    }

    async function exportLineup() {
      const data = await apiRequest('/api/export');
      if (!data) return;
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `vividorbit_lineup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Lineup backup downloaded");
    }

    function triggerImport() {
      document.getElementById('file-import').click();
    }

    async function handleFileImport(e) {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const json = JSON.parse(text);
        const res = await apiRequest('/api/import', 'POST', json);
        if (res && res.success) {
          showToast(`Restored ${res.matchedCount} channels from backup!`);
          loadState();
        }
      } catch (err) {
        showToast("⚠ Invalid backup JSON file");
      }
      e.target.value = '';
    }

    window.onload = loadState;
  </script>
</body>
</html>
